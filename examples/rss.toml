# RSS subscriptions: copy the blocks you need into ~/.config/pulpwise/config.toml.
#
# Every save ends up in Readwise Reader, so a Readwise access token is the one
# required piece of setup. Get one at https://readwise.io/access_token:

[auth.readwise]
token_path = "~/.config/pulpwise/readwise_token"   # chmod-600 file with just the token
# ...or inline: token = "XXX"
# ...or export PULPWISE_READWISE_TOKEN (wins over both).

# A plain feed subscription needs no options - `pulpwise add <feed-url>` writes
# this block for you. Entries are pushed as bare URL saves: Reader fetches and
# parses each linked page server-side.

[[subscriptions]]
name = "stratechery"
source = "rss"
url = "https://stratechery.com/feed"

# --- Reader routing ------------------------------------------------------------
#
#   location - where this subscription's saves land in Reader:
#              new | later | archive | feed. Unset = feed (pulpwise acts as
#              a feed reader in front of Reader; route a subscription to
#              "new" to put its picks in your triage flow instead).
#              Reader silently falls back to your account default if you
#              target a location you've disabled in your Reader settings.
#   tags     - comma-separated Reader tags applied to every document this
#              subscription pushes.

[[subscriptions]]
name = "simonw"
source = "rss"
url = "https://simonwillison.net/atom/everything/"

[subscriptions.options]
location = "feed"
tags = "blogs, tech"

# --- category filtering --------------------------------------------------------
#
# Feeds that mix content types often tag entries with categories (RSS
# <category>, Atom <category term=...>, <dc:subject>). Filter on them with
# comma-separated, case-insensitive lists:
#
#   categories         - allow-list: only entries carrying at least one listed
#                        category are pushed. Untagged entries are skipped.
#   exclude_categories - drop-list: entries carrying any listed category are
#                        skipped; untagged entries still come through. Wins
#                        over `categories` when both match.
#
# Filtering happens at discovery, so skipped entries never reach the dedup
# ledger or your Reader account. Options combine freely with location/tags.

[[subscriptions]]
name = "badlogic-links"
source = "rss"
url = "https://badlogic-list.lakebed.app/rss"

[subscriptions.options]
categories = "Recommended Reading"       # skip "Recommended Viewing" entries
location = "later"


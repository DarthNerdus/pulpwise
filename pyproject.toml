[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulpline"
version = "0.1.0"
description = "Local-first content pipeline for e-readers."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Egor Konovalov" }]
keywords = ["e-reader", "epub", "rss", "local-first", "boox", "kindle", "kobo", "substack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "trafilatura>=1.12",
    "ebooklib>=0.18",
    "tomli-w>=1.0",
    "textual>=0.86",
]

[project.scripts]
pulpline = "pulpline.cli:main"
pulp = "pulpline.cli:main"

[project.urls]
Homepage = "https://github.com/wtfnukee/pulpline"
Repository = "https://github.com/wtfnukee/pulpline"
Issues = "https://github.com/wtfnukee/pulpline/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulpline"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
warn_unreachable = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["feedparser", "trafilatura", "ebooklib.*", "lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pulpline",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.coverage.run]
source = ["src/pulpline"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "PTH", "RET"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
